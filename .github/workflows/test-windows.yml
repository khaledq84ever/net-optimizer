name: Test on real Windows

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "measure-only"
        type: choice
        options:
          - measure-only
          - report
          - apply
          - revert
          - menu
  push:
    branches: [main]
    paths:
      - "Optimize-Internet.ps1"
      - ".github/workflows/test-windows.yml"

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        shell: pwsh
        run: |
          $identity  = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $admin     = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "OS:         $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Admin:      $admin"

      - name: Parse-only sanity check
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\Optimize-Internet.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "Parse OK"

      - name: PSScriptAnalyzer
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          Invoke-ScriptAnalyzer -Path Optimize-Internet.ps1 -Severity Warning,Error |
            Format-Table -AutoSize

      - name: Run net-optimizer (${{ inputs.mode || 'measure-only' }})
        if: inputs.mode != 'menu'
        shell: pwsh
        run: |
          $mode = "${{ inputs.mode || 'measure-only' }}"
          $params = @{}
          switch ($mode) {
            "report"  { $params['Report'] = $true }
            "apply"   { $params['Apply']  = $true; $params['Report'] = $true }
            "revert"  { $params['Revert'] = $true }
            default   { }  # measure-only = no params
          }
          Write-Host "Running: .\Optimize-Internet.ps1 (mode=$mode)"
          & .\Optimize-Internet.ps1 @params
          Write-Host "ExitCode: $LASTEXITCODE"

      - name: Menu-driven test - Run.bat options 2,1,3,4,7,8 (like a human at the keyboard)
        if: inputs.mode == 'menu'
        shell: pwsh
        run: |
          # Feed real keystrokes into Run.bat's interactive menu: measure-only,
          # Auto, Apply-all, Apply+Gaming, Revert, then Exit. 'x' lines answer
          # the "pause" prompt after each run so the menu loops to the next one.
          $lines = @('2','x','1','x','3','x','4','x','7','x','8')
          $lines | Set-Content -Path menu_input.txt -Encoding ascii

          Write-Host "=== Driving Run.bat: [2] measure-only -> [1] Auto -> [3] Apply ALL -> [4] Apply+Gaming -> [7] Revert -> [8] Exit ==="
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c Run.bat > menu_output.log 2>&1" `
               -RedirectStandardInput "menu_input.txt" -PassThru -NoNewWindow -Wait
          Write-Host "Run.bat exit code: $($p.ExitCode)"
          Get-Content menu_output.log -ErrorAction SilentlyContinue

          $badPatterns = 'is not recognized|ParserError|Unhandled Exception|Exception calling|CategoryInfo\s*:|FullyQualifiedErrorId'
          $hits = Select-String -Path menu_output.log -Pattern $badPatterns -ErrorAction SilentlyContinue
          if ($hits) {
            Write-Host "##[error] Real menu/script errors found while testing options 2,1,3,4,7,8:"
            $hits | ForEach-Object { Write-Host "  line $($_.LineNumber): $($_.Line)" }
            exit 1
          }
          Write-Host "OK: no parser/cmdlet/unhandled-exception errors across options 2,1,3,4,7,8."

      - name: Menu-driven smoke test - option 5 (Watchdog)
        if: inputs.mode == 'menu'
        shell: pwsh
        run: |
          '5' | Set-Content -Path w5_input.txt -Encoding ascii
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c Run.bat > watch5_output.log 2>&1" `
               -RedirectStandardInput "w5_input.txt" -PassThru -NoNewWindow
          Start-Sleep -Seconds 12
          taskkill /F /T /PID $p.Id 2>&1 | Out-Null
          Start-Sleep -Seconds 2
          Write-Host "=== watch5_output.log (option 5, killed after 12s like Ctrl+C) ==="
          Get-Content watch5_output.log -ErrorAction SilentlyContinue

          $badPatterns = 'is not recognized|ParserError|Unhandled Exception|Exception calling|CategoryInfo\s*:|FullyQualifiedErrorId'
          $hits = Select-String -Path watch5_output.log -Pattern $badPatterns -ErrorAction SilentlyContinue
          if ($hits) {
            Write-Host "##[error] Real errors found while smoke-testing option 5:"
            $hits | ForEach-Object { Write-Host "  line $($_.LineNumber): $($_.Line)" }
            exit 1
          }
          Write-Host "OK: option 5 started cleanly with no errors."

      - name: Menu-driven smoke test - option 6 (Watchdog + auto-reset)
        if: inputs.mode == 'menu'
        shell: pwsh
        run: |
          '6' | Set-Content -Path w6_input.txt -Encoding ascii
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c Run.bat > watch6_output.log 2>&1" `
               -RedirectStandardInput "w6_input.txt" -PassThru -NoNewWindow
          Start-Sleep -Seconds 12
          taskkill /F /T /PID $p.Id 2>&1 | Out-Null
          Start-Sleep -Seconds 2
          Write-Host "=== watch6_output.log (option 6, killed after 12s like Ctrl+C) ==="
          Get-Content watch6_output.log -ErrorAction SilentlyContinue

          $badPatterns = 'is not recognized|ParserError|Unhandled Exception|Exception calling|CategoryInfo\s*:|FullyQualifiedErrorId'
          $hits = Select-String -Path watch6_output.log -Pattern $badPatterns -ErrorAction SilentlyContinue
          if ($hits) {
            Write-Host "##[error] Real errors found while smoke-testing option 6:"
            $hits | ForEach-Object { Write-Host "  line $($_.LineNumber): $($_.Line)" }
            exit 1
          }
          Write-Host "OK: option 6 started cleanly with no errors."

      - name: Show generated log (tail)
        if: always()
        shell: pwsh
        run: |
          $logs = Get-ChildItem -Path . -Filter "net-optimizer-*.log" -ErrorAction SilentlyContinue
          foreach ($l in $logs) {
            Write-Host "=== $($l.Name) ==="
            Get-Content $l.FullName -Tail 60
          }

      - name: Upload artifacts (log + report + backup json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: net-optimizer-output-${{ github.run_number }}
          path: |
            net-optimizer-*.log
            net-optimizer-*.html
            net-optimizer-backup-*.json
            menu_output.log
            watch5_output.log
            watch6_output.log
          if-no-files-found: ignore
          retention-days: 30
